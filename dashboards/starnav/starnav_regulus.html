<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>starnav regulus</title>

<style>

body{

    margin:0;
    background:#0B1F3A;
    font-family:Arial;
}

/* =========================
   CABEÇALHO
   ========================= */

header{

    height:80px;

    background:#08192f;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:8px 25px;

    box-sizing:border-box;

    border-bottom:2px solid #1CA3EC;

}

.home-button{

    display:block;

    height:65px;

    width:auto;

}

.home-button img{

    height:100%;
    width:auto;

    display:block;

}

.vessel{

    color:white;

    font-size:18px;
    font-weight:bold;

}


/* =========================
   CONTEÚDO
   ========================= */

section{

    width:95%;

    margin:20px auto;

}


/* =========================
   PRIMEIRA LINHA
   MAPA + INDICADORES
   ========================= */

.painel-superior{

    display:grid;

    grid-template-columns:3fr 1fr;

    gap:20px;

}


/* =========================
   MAPA
   ========================= */

#mapa{

    width:100%;

    height:750px;

    border:none;

}


/* =========================
   INDICADORES LATERAIS
   ========================= */

.indicadores{

    display:flex;

    flex-direction:column;

    gap:20px;

}


.indicadores iframe{

    width:100%;

    height:365px;

    border:none;

}


/* =========================
   GRÁFICOS INFERIORES
   ========================= */

.graficos-inferiores{

    display:flex;

    flex-direction:column;

    gap:30px;

    margin-top:30px;

}


.graficos-inferiores iframe{

    width:100%;

    height:550px;

    border:none;

}


/* =========================
   RESPONSIVO
   ========================= */

@media (max-width:900px){

    header{

        height:auto;

        padding:12px 15px;

        flex-direction:column;

        align-items:flex-start;

        gap:5px;

    }

    .home-button{

        height:50px;

    }

    .vessel{

        font-size:16px;

    }


    .painel-superior{

        grid-template-columns:1fr;

    }


    #mapa{

        height:550px;

    }


    .indicadores iframe{

        height:500px;

    }


    .graficos-inferiores iframe{

        height:500px;

    }

}

</style>

</head>


<body>


<header>

    <a href="https://rogerfidelis.github.io/ofi/index.html" class="home-button">

        <img src="../../imagens/logo_ofi.png" alt="OFI">

    </a>

    <div class="vessel">

        starnav regulus

    </div>

</header>


<section>


    <!-- =========================
         MAPA + INDICADORES
         ========================= -->

    <div class="painel-superior">


        <!-- MAPA -->

        <iframe
            id="mapa"
            src="../../mapas/starnav/starnav_regulus.html">
        </iframe>


        <!-- INDICADORES -->

        <div class="indicadores">

            <iframe
                id="grafico_status"
                src="../../graficos/status_navegacao/starnav/starnav_regulus.html">
            </iframe>


            <iframe
                id="grafico_atendimento"
                src="../../graficos/campo_atendimento/starnav/starnav_regulus.html">
            </iframe>

        </div>

    </div>



    <!-- =========================
         GRÁFICOS DE DISTÂNCIA
         ========================= -->

    <div class="graficos-inferiores">


        <!-- DISTÂNCIA ACUMULADA -->

        <iframe
            id="grafico_distancia_acumulada"
            src="../../graficos/distancia_acumulada/starnav/starnav_regulus.html">
        </iframe>


        <!-- DISTÂNCIA PONTO A PONTO -->

        <iframe
            id="grafico_distancia"
            src="../../graficos/distancia/starnav/starnav_regulus.html">
        </iframe>


    </div>


</section>


</body>

</html>
