<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>bram brasilia</title>

<style>

body{

    margin:0;
    background:#0B1F3A;
    font-family:Arial;
}

/* =========================
   CABEÇALHO
   ========================= */

header{

    height:80px;

    background:#08192f;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:8px 25px;

    box-sizing:border-box;

    border-bottom:2px solid #1CA3EC;
}

.home-button{

    display:block;

    height:55px;
    width:55px;

    text-decoration:none;

    position:relative;

    z-index:99999;

}

.home-button img{

    height:100%;
    width:100%;

    object-fit:contain;

    display:block;

}

.vessel{

    color:white;

    font-size:18px;
    font-weight:bold;

}

/* =========================
   CONTEÚDO
   ========================= */

section{

    width:95%;

    margin:20px auto;
}

iframe{

    width:100%;
    border:none;
}

#mapa{

    height:550px;
}

.graficos{

    display:flex;

    gap:20px;

    margin-top:30px;
}

#grafico_status{

    flex:1;

    height:550px;
}

#grafico_deslocamento{

    flex:2;

    height:550px;
}

/* =========================
   RESPONSIVO
   ========================= */

@media (max-width:900px){

    header{

        height:auto;

        padding:12px 15px;

        flex-direction:column;

        align-items:flex-start;

        gap:5px;

    }

    .home-button{

    height:55px;
    width:55px;

    }   

    .vessel{

        font-size:16px;

    }

    .graficos{

        flex-direction:column;

    }

    #grafico_status,
    #grafico_deslocamento{

        width:100%;
        height:500px;

    }

}

</style>

</head>

<body>


<header>

    <a href="https://rogerfidelis.github.io/ofi/index.html" class="home-button">

        <img src="../../imagens/logo_ofi.png" alt="OFI">

    </a>

    <div class="vessel">

        bram brasilia

    </div>

</header>


<section>

    <iframe
    id="mapa"
    src="../../mapas/cbo/bram_brasilia.html">
    </iframe>


    <div class="graficos">

        <iframe
        id="grafico_status"
        src="../../graficos/status_navegacao/cbo/bram_brasilia.html">
        </iframe>

        <iframe
        id="grafico_deslocamento"
        src="../../graficos/distancia/cbo/bram_brasilia.html">
        </iframe>

    </div>

</section>


</body>

</html>
